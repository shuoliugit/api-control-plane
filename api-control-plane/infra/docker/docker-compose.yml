services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: api_control_plane
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: control_plane
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d api_control_plane"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../../backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_control_plane
      SPRING_DATASOURCE_USERNAME: control_plane
      SPRING_DATASOURCE_PASSWORD: control_plane
      REDIS_HOST: redis
      JWT_SECRET: compose-secret-compose-secret-compose-secret-compose-secret
      ADMIN_EMAIL: admin@controlplane.local
      ADMIN_PASSWORD: AdminPassword123!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../../frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
